name: dump-api-schemas

# 目的：一次撈 FinMind + FMP + FRED + AlphaVantage 所有相關 dataset / endpoint / series 的實際欄位名，
# 讓 valuation/simulator.js 可以用真的 field name 而不是猜。
# 順便驗證 4 個 API key 到底能不能通 / 額度剩多少。
#
# 前置：Repo → Settings → Secrets and variables → Actions 加四個 secret：
#   FINMIND_TOKEN         = FinMind API token
#   FMP_API_KEY           = FMP API key
#   FRED_API_KEY          = FRED API key（fred.stlouisfed.org/docs/api/api_key.html 免費申請）
#   ALPHAVANTAGE_API_KEY  = AlphaVantage API key（alphavantage.co/support/#api-key 免費申請）
#
# ⚠️ AlphaVantage 免費 tier 只有 25 次/日，dump script 已經照類別分批 + 節流。
#    av_categories 預設是 all（全部 30 個 endpoint，一次列出 AlphaVantage 抓到的所有數據），
#    這會直接吃光當天 25 次額度（超過的部分會清楚標示失敗原因，不是漏掉）——
#    代表這個 workflow 跑完當天，app 裡查詢遇到 FMP 402 時的 AlphaVantage 備援也會失敗，
#    要等隔天額度重置。若不想影響 app 當天可用性，把 av_categories 改小（例如只填 intelligence）。
#
# 用法：Actions → dump-api-schemas → Run workflow → 可改 ticker / av_categories → 跑完下載 artifact
# 或看 job step summary（會直接 render 出來）。

on:
  workflow_dispatch:
    inputs:
      tw_ticker:
        description: '台股 ticker（FinMind 用，純數字）'
        default: '2330'
        required: false
      us_ticker:
        description: '美股 ticker（FMP 用，純字母）'
        default: 'AAPL'
        required: false
      years:
        description: '往回抓幾年（覆蓋損益 / 現金流的樣本量）'
        default: '2'
        required: false
      av_categories:
        description: '⚠️ 只填「類別」名稱不是 AV function 名（不要填 INCOME_STATEMENT 這種）：fundamentals/intelligence/timeseries/forex/commodities/econ/technical，逗號分隔；填 all = 全部一次跑（30 個 endpoint，會超過 25次/日額度，超額的那幾個會清楚標示失敗原因）'
        default: 'all'
        required: false

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dump FinMind + FMP + FRED + AlphaVantage schemas
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          TW_TICKER: ${{ inputs.tw_ticker }}
          US_TICKER: ${{ inputs.us_ticker }}
          YEARS: ${{ inputs.years }}
          AV_CATEGORIES: ${{ inputs.av_categories }}
        run: |
          mkdir -p schema-dump
          node .github/scripts/dump-schemas.mjs 2>&1 | tee schema-dump/full-report.md
          echo "---"
          echo "✅ Report at schema-dump/full-report.md"

      - name: Add report to job summary
        if: always()
        run: |
          echo "## 📊 Schema dump report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat schema-dump/full-report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-dump-${{ inputs.tw_ticker }}-${{ inputs.us_ticker }}
          path: schema-dump/
          retention-days: 30

name: 台股月營收連續成長榜

on:
  workflow_dispatch:
    inputs:
      months:
        description: '回溯幾個月（預設 36）'
        required: false
        default: '36'
  schedule:
    - cron: '30 4 12 * *'        # ★ 每月 12 日 12:30 台灣時間（各公司 10 日前公布上月營收）

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # ★ 全部 stdlib，不需要 pip install

      - name: 抓全市場月營收
        run: |
          set -e
          M=$(printf '%s' "${{ inputs.months || '36' }}" | tr -cd '0-9'); M=${M:-36}
          echo "★ 回溯 $M 個月"
          python3 rev/scripts/rev_bulk.py                 # 最新一期（含市場別、產業）
          python3 rev/scripts/rev_bulk.py --history "$M"  # 歷史，一月一 call
          python3 rev/scripts/rev_streak_report.py --out rev/index.html

      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A rev
          git diff --cached --quiet && { echo "★ 沒有變動"; exit 0; }
          git commit -m "台股月營收連續成長榜：$(date -u +%Y-%m-%d)"
          git push

      - name: 網址
        run: |
          echo "### ★ 台股月營收連續成長榜" >> $GITHUB_STEP_SUMMARY
          echo "- 報表 https://htmlpreview.github.io/?https://github.com/delphichi/2025TRIP/blob/main/rev/index.html" >> $GITHUB_STEP_SUMMARY
          echo "- CSV  https://github.com/delphichi/2025TRIP/raw/main/rev/index.csv" >> $GITHUB_STEP_SUMMARY

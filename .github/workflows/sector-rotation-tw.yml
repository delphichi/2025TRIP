name: sector-rotation-tw-daily

# 目的：每交易日跑台股板塊輪動 Phase 1 pipeline（scripts/tw_sector_pipeline.py）
#   + 產出每日報表（scripts/generate_daily_report_tw.py）· commit data/sector_rotation/tw_*
#   跟 sector-rotation/reports/daily-tw-*.html
#   + 額外累積 TWSE OpenAPI 官方快照（scripts/tw_twse_snapshot.py，不需要 token、
#     跟 FinMind 額度無關）：MI_INDEX（官方類股指數，未來可能取代 Layer 1 抽樣平均）
#     跟 STOCK_DAY_ALL（全上市個股官方 OHLCV，未來可能取代 FinMind 逐股查詢）；
#     兩者都只有「當下最新交易日」快照，先純累積存檔，還沒接進 Layer 0-3 計算邏輯。
#     另外每次也會嘗試累積財報基本資料（損益表+資產負債表 × 6 個產業別，一樣不需要
#     token）；財報季更新，季別沒變就跳過存檔，不會每天產生重複檔案。
#
# 排程：FinMind 文件標示的更新時間都是 Taipei time（UTC+8）：
#   TaiwanStockPrice                          星期一至五 17:30
#   TaiwanStockInstitutionalInvestorsBuySell  星期一至五 20:00
#   兩個都更新完才跑，UTC 13:00（= Taipei 21:00）留了安全緩衝。
#
# 手動觸發：Actions → sector-rotation-tw-daily → Run workflow
#
# 前置：Repo → Settings → Secrets and variables → Actions 加：
#   FINMIND_TOKEN = FinMind API token（免費申請：finmindtrade.com）
#   免費 tier 300 次/小時；Layer 2 個股價量已經改用 yfinance（不吃 FinMind 額度），
#   FinMind 現在只剩 Layer 3 三大法人資料 + 固定開銷，budget ≈ N+1 次
#   （預設股票池 300 檔 ≈ 301 次，實測壓在 300/hr 上限邊緣但沒觸發 429/402；
#   萬一真的撞到額度，Layer 3 quota 用完只會讓後段幾檔缺法人資料，Layer 2
#   價量/趨勢資料不受影響——優雅降級，不會整批失敗）。
#   TWMARKETDATA_API_KEY = TW Market Data API key（twmarketdata.com，選填）
#   給 Layer 0 市場快照真實 TAIEX 指數用（1 次 request/次執行，跟 FinMind 額度無關）；
#   沒設就自動退回 0050 ETF 代理，不影響 pipeline 其餘部分。

on:
  schedule:
    - cron: '0 13 * * 1-5'      # 週一~五 UTC 13:00（Taipei 21:00）
  workflow_dispatch:
    inputs:
      as_of_date:
        description: '回放日期 YYYY-MM-DD · 空 = 用最新'
        required: false
        default: ''
      universe_size:
        description: '股票池大小（依 TWSE 即時市值排名前 N 檔；排名失敗才退回 UNIVERSE_SEED 靜態清單）· Layer 2 已用 yfinance，FinMind budget 只剩 N+1（Layer 3 法人資料），免費 tier 300 次/小時'
        required: false
        default: '300'
      report_only:
        description: '只重新排版報表（跳過 pipeline 抓資料 + TWSE 快照，不吃任何 API 額度）· 用已 commit 的 tw_*.csv/json 重跑 generate_daily_report_tw.py，適合純調報表排版/顯示邏輯時用'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  tw-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install pandas requests yfinance

      - name: Run TW sector pipeline (Layer 0-3)
        if: ${{ !inputs.report_only }}
        shell: bash
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TWMARKETDATA_API_KEY: ${{ secrets.TWMARKETDATA_API_KEY }}
          AS_OF: ${{ inputs.as_of_date }}
          UNIVERSE_SIZE: ${{ inputs.universe_size }}
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "$AS_OF" ]; then ARGS="$ARGS --as-of $AS_OF"; fi
          if [ -n "$UNIVERSE_SIZE" ]; then ARGS="$ARGS --universe-size $UNIVERSE_SIZE"; fi
          python scripts/tw_sector_pipeline.py $ARGS 2>&1 | tee /tmp/tw_pipeline.log

      - name: Generate TW daily report
        shell: bash
        run: |
          set -o pipefail
          python scripts/generate_daily_report_tw.py 2>&1 | tee /tmp/tw_report.log

      # 獨立於 Layer 0-3、不影響上面兩步：累積 TWSE OpenAPI MI_INDEX（官方類股指數）
      # + STOCK_DAY_ALL（全上市個股官方 OHLCV）每日快照，供未來接進 Layer 1/2 用。
      # 兩個 endpoint 都只回傳「當下最新交易日」，累積夠歷史前先純存檔；continue-on-error
      # 保底（腳本內部本身也吞了所有例外，正常不會讓這步失敗）。
      - name: Snapshot TWSE OpenAPI (MI_INDEX + STOCK_DAY_ALL + 財報季度快照)
        if: ${{ !inputs.report_only }}
        continue-on-error: true
        shell: bash
        run: |
          python scripts/tw_twse_snapshot.py 2>&1 | tee /tmp/twse_snapshot.log

      - name: Summary
        if: always()
        run: |
          echo "## 台股板塊輪動 · $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo '### Pipeline log（尾 40 行）' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -40 /tmp/tw_pipeline.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(no log)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f data/sector_rotation/tw_scorecard_latest.json ]; then
            echo '### tw_scorecard_latest.json（不含 rows）' >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            python -c "import json; d=json.load(open('data/sector_rotation/tw_scorecard_latest.json')); d.pop('rows',None); print(json.dumps(d,indent=2,ensure_ascii=False))" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit snapshots
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sector_rotation/tw_*.csv data/sector_rotation/tw_*.json 2>/dev/null || true
          git add data/sector_rotation/twse_raw/*.csv 2>/dev/null || true
          git add sector-rotation/reports/daily-tw-*.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new data to commit"
            exit 0
          fi
          STAMP="$(date -u '+%Y-%m-%d')"
          if [ -n "${{ inputs.as_of_date }}" ]; then STAMP="replay ${{ inputs.as_of_date }}"; fi
          git commit -m "chore(sector-rotation-tw): snapshot $STAMP"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && break
            echo "Push attempt $i failed · sleep $((2**i))s"
            sleep $((2**i))
          done

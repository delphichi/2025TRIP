name: 定期定額試算（含息 vs 不含息）

# ★ 換標的就改 tickers。台股填代號（自動試 .TW / .TWO）、美股填字母。
#   全部走 Yahoo 價量與配息，★ 不需要 SEC_UA。

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: '標的（最多 6 支，空白或逗號分隔）台股填代號、美股填字母'
        required: true
        default: '0050 0056 00878 00919'
      amount:
        description: '每月投入金額（以各標的計價幣別計）'
        required: false
        default: '10000'
      title:
        description: '網頁標題'
        required: false
        default: '定期定額試算'
      slug:
        description: '存檔資料夾（dca/<slug>/index.html；留空＝dca/index.html）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # ★ 全部 stdlib，不需要 pip install

      - name: 產生試算頁
        run: |
          set -e
          # ★ #518：workflow_dispatch 輸入常混入 ﻿ 等不可見字元
          TKS=$(printf '%s' "${{ inputs.tickers }}" | tr ',;' '  ' | tr -cd 'A-Za-z0-9.\- ' | sed 's/^ *//; s/ *$//')
          AMT=$(printf '%s' "${{ inputs.amount }}" | tr -cd '0-9')
          SLUG=$(printf '%s' "${{ inputs.slug }}"  | tr -cd 'A-Za-z0-9\-_')
          OUT="dca/index.html"; [ -n "$SLUG" ] && OUT="dca/$SLUG/index.html"
          mkdir -p "$(dirname "$OUT")"
          echo "★ 標的：$TKS"
          echo "★ 每月：${AMT:-10000}"
          echo "★ 輸出：$OUT"
          python3 phase/scripts/dca_gen.py $TKS \
            --amount "${AMT:-10000}" --title "${{ inputs.title }}" --out "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dca
          git diff --cached --quiet && { echo "★ 沒有變動"; exit 0; }
          git commit -m "定期定額：${{ inputs.tickers }}"
          git push

      - name: 網址
        run: |
          {
            echo "### ★ 產出完成"
            echo ""
            echo "標的：\`${{ inputs.tickers }}\`　每月：\`${{ inputs.amount }}\`"
            echo ""
            echo "- htmlpreview：https://htmlpreview.github.io/?https://github.com/delphichi/2025TRIP/blob/main/$OUT"
            echo "- GitHub Pages（若已開啟）：https://delphichi.github.io/2025TRIP/$(dirname $OUT)/"
          } >> "$GITHUB_STEP_SUMMARY"

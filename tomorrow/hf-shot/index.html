<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>明天先生撕日曆 · HyperFrames 5 秒試拍</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Noto Serif TC";
        src: url("assets/noto-serif-tc-700.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Noto Serif TC";
        src: url("assets/noto-serif-tc-900.woff2") format("woff2");
        font-weight: 900;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #d9e1df;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Noto Serif TC", serif;
      }
      #stage,
      #fiber,
      #vignette {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #fiber {
        mix-blend-mode: multiply;
        opacity: 0.32;
      }
      #vignette {
        background: radial-gradient(ellipse at 55% 50%, rgba(0, 0, 0, 0) 55%, rgba(40, 28, 18, 0.35) 100%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="d1" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="5" dy="9" stdDeviation="5.5" flood-color="#3b2a1a" flood-opacity="0.27" /></filter>
          <filter id="d2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="8" dy="14" stdDeviation="8" flood-color="#3b2a1a" flood-opacity="0.32" /></filter>
          <filter id="d3" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="11" dy="19" stdDeviation="10.5" flood-color="#3b2a1a" flood-opacity="0.37" /></filter>
          <filter id="d4" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="14" dy="24" stdDeviation="13" flood-color="#3b2a1a" flood-opacity="0.42" /></filter>
          <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14" /></filter>
          <filter id="dof" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2.4" /></filter>
          <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE9B8" stop-opacity="0.95" /><stop offset="1" stop-color="#FFD58A" stop-opacity="0.15" /></linearGradient>
          <linearGradient id="dawn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD1A6" stop-opacity="0.95" /><stop offset="1" stop-color="#FFB98A" stop-opacity="0.12" /></linearGradient>
          <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#BFD3FF" stop-opacity="0.55" /><stop offset="1" stop-color="#9DB6E8" stop-opacity="0.05" /></linearGradient>
        </defs>
        <g id="scene"></g>
      </svg>
      <img id="fiber" src="assets/fiber.png" alt="" />
      <div id="vignette"></div>
    </div>
    <script>
      // 明天先生撕日曆：v1（Remotion）紙雕房間與角色移植成 HyperFrames。
      // 24 fps、5 秒、動作一拍兩格；每一格只由幀號決定，可任意 seek。
      const FPS = 24;
      const FRAMES = 120;
      const SERIF = "Noto Serif TC";
      const C = {
        wall: "#D9E1DF", wall2: "#C3CDCB", ceil: "#E8E3D8", floor: "#9C8068", floor2: "#86694F",
        wood: "#D8B88A", wood2: "#B48E66", bed: "#3E4352", blanket: "#E9E2D3", orange: "#E0663A",
        mustard: "#D9B44A", ink: "#2A2522", paper: "#FBF7F0", calred: "#D6453A", hoodie: "#4F7FA6", sage: "#8FA98B",
      };

      // ── 工具 ──────────────────────────────────────────────
      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const lerp = (a, b, t) => a + (b - a) * t;
      const inOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
      const expoOut = (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));
      const rad = (d) => (d * Math.PI) / 180;
      /** 關鍵格插值：[[幀, 值], …]，段間 ease in-out。 */
      const keys = (f, ks, ease = inOut) => {
        if (f <= ks[0][0]) return ks[0][1];
        for (let i = 1; i < ks.length; i++) {
          const [fa, va] = ks[i - 1];
          const [fb, vb] = ks[i];
          if (f <= fb) return lerp(va, vb, ease((f - fa) / (fb - fa || 1)));
        }
        return ks[ks.length - 1][1];
      };
      /** 立體書彈起：0 → 過衝 1.12 → 1 */
      const popUp = (f, start, n = 8) => keys(f, [[start, 0], [start + n * 0.55, 1.12], [start + n, 1]], expoOut);
      /** 種子亂數（字串 → 0–1），取代 Math.random。 */
      const rnd = (s) => {
        let h = 2166136261;
        for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
        h = Math.imul(h ^ (h >>> 15), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        return ((h ^= h >>> 16) >>> 0) / 4294967296;
      };
      const hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
      const mixColor = (pairs) => {
        const tot = pairs.reduce((s, [, w]) => s + w, 0) || 1;
        const rgb = [0, 1, 2].map((i) => Math.round(pairs.reduce((s, [c, w]) => s + hex(c)[i] * w, 0) / tot));
        return `rgb(${rgb.join(",")})`;
      };
      const circleD = (cx, cy, r) => `M${cx + r},${cy} A${r},${r} 0 1 0 ${cx - r},${cy} A${r},${r} 0 1 0 ${cx + r},${cy}Z`;

      /** 一張剪好的紙：平塗＋投影＋左上切口亮邊。 */
      const Cut = (d, fill, depth = 2, flat = false) =>
        `<g${flat ? "" : ` filter="url(#d${depth})"`}><path d="${d}" fill="${fill}"/>` +
        `<path d="${d}" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="2" transform="translate(-1 -1)"/></g>`;
      const txt = (x, y, s, size, fill, w = 900) =>
        `<text x="${x}" y="${y}" text-anchor="middle" font-family="${SERIF}" font-weight="${w}" font-size="${size}" fill="${fill}">${s}</text>`;
      /** 定格抖動：每 2 格換一次微小位移與旋轉。 */
      const boil = (id, step, amp = 1) => {
        const dx = (rnd(`${id}x${step}`) - 0.5) * 1.2 * amp;
        const dy = (rnd(`${id}y${step}`) - 0.5) * 1.2 * amp;
        const r = (rnd(`${id}r${step}`) - 0.5) * 0.6 * amp;
        return `translate(${dx.toFixed(2)} ${dy.toFixed(2)}) rotate(${r.toFixed(2)})`;
      };

      // ── 房間（與 v1 同一套座標） ────────────────────────────
      const Room = (sky) => {
        let s = "";
        s += Cut("M-400,-300 H2320 L1620,90 L300,90Z", C.ceil, 1);
        s += Cut("M300,90 H1620 V700 H300Z", C.wall, 1);
        s += Cut("M-400,-300 L300,90 L300,700 L-400,1400Z", C.wall2, 2);
        s += Cut("M1620,90 L2320,-300 L2320,1400 L1620,700Z", C.wall2, 2);
        s += Cut("M300,700 H1620 L2320,1400 H-400Z", C.floor, 1);
        for (let k = 1; k <= 8; k++) s += `<path d="M${300 + (k * 1320) / 9},700 L${-400 + (k * 2720) / 9},1400" stroke="${C.floor2}" stroke-width="3" opacity="0.6"/>`;
        s += Cut("M40,180 L232,232 L232,522 L40,562Z", sky, 2);
        s += `<path d="M40,180 L232,232 L232,522 L40,562Z M136,206 L136,542 M40,370 L232,377" fill="none" stroke="${C.paper}" stroke-width="12"/>`;
        s += Cut("M30,560 L242,520 L262,532 L40,580Z", C.paper, 2);
        s += Cut("M420,300 H760 V318 H420Z", C.paper, 2);
        [[C.calred, 70], [C.sage, 82], [C.mustard, 64], [C.hoodie, 76], [C.wood2, 70]].forEach(([c, h], k) => {
          s += Cut(`M${440 + k * 34},300 V${300 - h} H${468 + k * 34} V300Z`, c, 1);
        });
        s += Cut("M880,330 H1220 V540 H880Z", "#2F4A5E", 2);
        s += Cut("M900,520 L980,420 L1040,480 L1100,400 L1200,520Z", C.mustard, 1);
        s += `<circle cx="1150" cy="380" r="22" fill="${C.paper}" opacity="0.8"/>`;
        s += Cut("M1120,600 H1600 V780 H1120Z", C.wood, 3);
        s += Cut("M1130,560 H1590 V640 H1130Z", C.bed, 3);
        s += Cut("M1300,540 H1600 V650 H1300Z", C.blanket, 3);
        s += Cut("M1140,520 Q1160,490 1230,500 Q1270,520 1250,560 H1150Z", C.paper, 3);
        s += Cut("M1160,690 H1290 V730 H1160Z M1420,690 H1550 V730 H1420Z", C.wood2, 2);
        s += Cut("M400,640 H880 V676 H400Z", C.wood, 3);
        s += Cut("M420,676 H446 V900 H420Z M834,676 H860 V900 H834Z", C.wood2, 3);
        s += Cut("M700,676 H834 V780 H700Z", C.wood, 3);
        s += Cut("M752,720 H784 V734 H752Z", C.mustard, 1);
        s += Cut("M470,640 H530 V628 H470Z", C.paper, 3);
        s += `<g filter="url(#d3)" stroke="${C.paper}" stroke-width="9" fill="none" stroke-linecap="round"><path d="M500,630 L470,520 L560,470"/></g>`;
        s += Cut("M540,450 L620,470 L600,520 L520,500Z", C.paper, 3);
        s += Cut("M600,640 L760,640 L752,622 L608,622Z", C.paper, 3);
        s += Cut("M604,622 H756 V614 H604Z", C.hoodie, 3);
        s += Cut("M780,640 L860,640 L854,628 L786,628Z", C.orange, 3);
        s += `<g transform="rotate(-12 1720 760)">${Cut("M1700,420 H1740 V640 H1700Z", C.wood2, 3)}${Cut(`${circleD(1720, 640, 72)} ${circleD(1720, 780, 92)}`, C.orange, 3)}<circle cx="1720" cy="720" r="22" fill="${C.ink}"/></g>`;
        s += Cut("M540,940 q10,-34 60,-30 l40,14 q30,4 30,22 Z M640,948 q10,-30 56,-28 l40,12 q28,6 28,22 Z", C.paper, 3);
        return s;
      };

      // ── 光：午後斜陽 → 月光 → 晨光（光束掃過地板） ────────────
      const BIG = 'x="-3000" y="-3000" width="9000" height="9000"';
      const Light = ({ sun, moon, night, dawn, sweep }) => {
        const beam = `M45,190 L232,236 L${1080 + sweep},972 L${540 + sweep * 0.8},1000Z`;
        const patch = `M${560 + sweep * 0.8},770 L${990 + sweep},760 L${1090 + sweep},990 L${520 + sweep * 0.8},1000Z`;
        const dawnBeam = `M45,200 L232,250 L${1180 + sweep * 0.5},920 L${660 + sweep * 0.4},960Z`;
        let s = "";
        if (night > 0) s += `<rect ${BIG} fill="#1d2a45" style="mix-blend-mode:multiply" opacity="${0.62 * night}"/>`;
        if (sun > 0)
          s += `<path d="${beam}" fill="url(#beam)" filter="url(#soft)" style="mix-blend-mode:screen" opacity="${0.75 * sun}"/>` +
            `<path d="${patch}" fill="#FFE6B0" filter="url(#soft)" style="mix-blend-mode:screen" opacity="${0.45 * sun}"/>`;
        if (moon > 0) s += `<path d="${beam}" fill="url(#moon)" filter="url(#soft)" style="mix-blend-mode:screen" opacity="${0.55 * moon}"/>`;
        if (dawn > 0)
          s += `<path d="${dawnBeam}" fill="url(#dawn)" filter="url(#soft)" style="mix-blend-mode:screen" opacity="${0.8 * dawn}"/>` +
            `<rect ${BIG} fill="#FFD9B8" style="mix-blend-mode:multiply" opacity="${0.18 * dawn}"/>`;
        return s;
      };
      /** 光束裡的浮塵（不套一拍兩格，保持平順）。 */
      const Dust = (f, k) => {
        if (k <= 0) return "";
        let s = "";
        for (let i = 0; i < 46; i++) {
          const t = (rnd(`dt${i}`) + f * (0.0006 + rnd(`ds${i}`) * 0.0008) * 6) % 1;
          const kk = rnd(`dk${i}`);
          const x = 140 + t * 820 + kk * 160 + Math.sin(f / 30 + i) * 6;
          const y = 220 + t * 760 - kk * 40 + Math.cos(f / 26 + i * 2) * 8;
          const a = Math.sin(Math.PI * t);
          s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1.5 + rnd(`dr${i}`) * 2.5).toFixed(2)}" fill="#FFF4D8" opacity="${((0.3 + rnd(`do${i}`) * 0.55) * a * k).toFixed(3)}"/>`;
        }
        return s;
      };

      // ── 日曆頁（以頁中心為原點，140×170） ─────────────────────
      const Page = (date, depth = 3) =>
        Cut("M-70,-85 H70 V85 H-70Z", C.paper, depth) +
        `<path d="M-70,-85 H70 V-51 H-70Z" fill="${C.calred}"/>` +
        txt(0, -57, "十月", 24, C.paper) +
        txt(0, 53, date, 92, C.ink);

      // ── 明天先生 ──────────────────────────────────────────
      const mirror = (a) => [180 - a[0], 180 - a[1]];
      const Face = (face, top) => {
        const st = `stroke="${C.ink}" stroke-width="5" stroke-linecap="round" fill="none"`;
        const tilt = face === "proud" ? -10 : -6;
        return (
          `<circle cx="-22" cy="${top - 62}" r="7" fill="${C.ink}"/><circle cx="22" cy="${top - 62}" r="7" fill="${C.ink}"/>` +
          `<path d="M-34,${top - 80} l20,${tilt} M34,${top - 80} l-20,${tilt}" ${st}/>` +
          (face === "proud"
            ? `<path d="M-24,${top - 36} Q0,${top - 14} 24,${top - 36}Z" fill="${C.ink}"/>`
            : `<path d="M-20,${top - 34} Q0,${top - 20} 20,${top - 34}" ${st}/>`)
        );
      };
      const Mister = ({ pages, date, face, armL, armR, puff, step, tear, pile }) => {
        const bh = 60 + pages * 12;
        const top = -100 - bh;
        let s = `<g transform="translate(1440 1012) scale(0.8)">`;
        // 地上的撕下來的日曆堆（在他左手邊）
        pile.forEach(([px, py, pr, pd], i) => {
          s += `<g transform="translate(${px} ${py}) rotate(${pr}) scale(0.42) ${boil("pile" + i, step, 0.6)}">${Page(pd, 2)}</g>`;
        });
        s += `<g transform="${boil("mister", step, 1.4)}">`;
        // 摺紙腿（之字形）
        [-40, 40].forEach((lx) => {
          const d = `M${lx},0 l-14,-20 l28,-20 l-28,-20 l28,-20 l-14,-20`;
          s += `<path d="${d}" fill="none" stroke="${C.paper}" stroke-width="20" stroke-linejoin="round" filter="url(#d2)"/>`;
          s += `<path d="${d}" fill="none" stroke="${C.calred}" stroke-width="3" stroke-linejoin="round" opacity="0.6"/>`;
        });
        // 身體：一疊日曆（挺胸時橫向撐開）
        s += `<g transform="translate(0 -100) scale(${1 + puff * 0.07} 1) translate(0 100)">`;
        s += Cut(`M-90,-100 V${top} H90 V-100Z`, C.paper, 3);
        for (let k = 0; k < Math.floor(pages); k++) {
          const yy = -100 - ((k + 1) * bh) / pages;
          s += `<path d="M-90,${yy.toFixed(1)} H90" stroke="${C.ink}" stroke-opacity="0.12" stroke-width="2"/>`;
        }
        s += `<path d="M-90,${top} H90 V${top + 14} H-90Z" fill="${C.calred}"/>`;
        s += `<g transform="translate(0 ${top + 115})">${Page(date, 3)}</g>`;
        s += `</g>`;
        // 手臂：兩段摺紙條
        [[-1, armL], [1, armR]].forEach(([side, [a1, a2]]) => {
          const sx = side * 90;
          const sy = top + 60;
          const ex = sx + 72 * Math.cos(rad(a1));
          const ey = sy - 72 * Math.sin(rad(a1));
          const hx = ex + 70 * Math.cos(rad(a2));
          const hy = ey - 70 * Math.sin(rad(a2));
          const d = `M${sx},${sy} L${ex.toFixed(1)},${ey.toFixed(1)} L${hx.toFixed(1)},${hy.toFixed(1)}`;
          s += `<path d="${d}" fill="none" stroke="${C.paper}" stroke-width="22" stroke-linejoin="round" filter="url(#d2)"/>`;
          s += `<path d="${d}" fill="none" stroke="${C.ink}" stroke-opacity="0.12" stroke-width="2"/>`;
        });
        // 頭＋帽子
        s += Cut(`M-60,${top} V${top - 120} H60 V${top}Z`, C.paper, 3);
        s += `<path d="M-60,${top - 120} H60 V${top - 96} H-60Z" fill="${C.calred}"/>`;
        s += `<circle cx="-28" cy="${top - 108}" r="5" fill="${C.paper}"/><circle cx="28" cy="${top - 108}" r="5" fill="${C.paper}"/>`;
        s += Face(face, top);
        s += Cut(`M-74,${top - 118} L0,${top - 214} L74,${top - 118}Z`, "#EDE5D5", 3);
        s += txt(0, top - 140, "明天", 34, C.calred);
        s += `</g>`;
        // 被撕下的那頁：一甩往肩後飛、翻轉、飄落到地上的紙堆
        if (tear) {
          const { k, date: old, land } = tear;
          const [lx, ly, lr] = land;
          const x0 = 0, y0 = top + 115;
          const x = lerp(x0, lx, expoOut(Math.min(1, k * 1.15)));
          const y = lerp(y0, ly, k * k) - 230 * Math.sin(Math.PI * Math.min(1, k * 1.25)) * (1 - k * 0.5);
          const r = lerp(0, -360 + lr, expoOut(k)) + Math.sin(k * Math.PI * 3) * 22 * (1 - k);
          const sc = lerp(1, 0.42, expoOut(k));
          s += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r.toFixed(1)}) scale(${sc.toFixed(3)})">${Page(old, 4)}</g>`;
        }
        s += `</g>`;
        return s;
      };

      // ── 時間表（幀） ──────────────────────────────────────
      // 0–26 午後斜陽 → 26–48 夜・月光 → 48–76 第一個早晨（60–76 撕下 13）
      // → 76–90 第二夜 → 90–120 第二個早晨（96–112 撕下 14）
      const TEARS = [
        { start: 60, n: 16, old: "13", next: "14", land: [-300, -18, -14] },
        { start: 96, n: 16, old: "14", next: "15", land: [-318, 6, 28] },
      ];
      const PILE0 = [
        [-290, -26, -38, "9"],
        [-342, 10, 12, "10"],
        [-252, 12, 26, "11"],
        [-312, -2, -6, "12"],
      ];
      const REST = [-124, -98];
      const GRIP = [160, -5];
      const FLICK = [120, 150];
      const PROUD = [-150, -50];
      const armKeys = (pose) => (f) => [keys(f, pose.map(([fr, p]) => [fr, p[0]])), keys(f, pose.map(([fr, p]) => [fr, p[1]]))];
      const armLAt = armKeys([
        [0, REST], [50, REST], [56, GRIP], [60, GRIP], [64, FLICK], [72, PROUD], [86, PROUD],
        [92, GRIP], [96, GRIP], [100, FLICK], [108, PROUD], [120, PROUD],
      ]);
      const armRAt = armKeys([
        [0, mirror(REST)], [50, mirror(REST)], [56, mirror(GRIP)], [60, mirror(GRIP)], [66, mirror(PROUD)], [86, mirror(PROUD)],
        [92, mirror(GRIP)], [96, mirror(GRIP)], [102, mirror(PROUD)], [120, mirror(PROUD)],
      ]);

      const scene = document.getElementById("scene");
      let lastFrame = -1;
      function draw(frame) {
        const fr = Math.max(0, Math.min(FRAMES - 1, Math.floor(frame + 1e-6)));
        if (fr === lastFrame) return;
        lastFrame = fr;
        const f = Math.floor(fr / 2) * 2; // 一拍兩格
        const step = f / 2;

        const sun = keys(f, [[0, 1], [22, 1], [34, 0]]);
        const night = keys(f, [[0, 0], [26, 0], [36, 1], [42, 1], [52, 0], [76, 0], [82, 0.85], [86, 0.85], [92, 0]]);
        const moon = keys(f, [[0, 0], [30, 0], [38, 1], [42, 1], [50, 0], [78, 0], [83, 0.9], [86, 0.9], [90, 0]]);
        const dawn = keys(f, [[0, 0], [44, 0], [54, 1], [72, 1], [80, 0], [88, 0], [96, 1], [120, 1]]);
        const sweep = keys(f, [[0, -140], [30, 240], [48, -160], [74, 120], [90, -160], [120, 160]], (t) => t);
        const sky = mixColor([["#F6E7C8", Math.max(0, sun)], ["#2B3A5C", night * 1.4], ["#FFD3A8", dawn * (1 - night)]]);

        // 撕頁、長高、日期
        let date = "13";
        let pages = 10;
        let puff = 0;
        let face = "smile";
        let tear = null;
        const pile = PILE0.slice();
        TEARS.forEach((t, i) => {
          const k = (f - t.start) / t.n;
          if (k >= 0) date = t.next;
          pages += 4 * popUp(f, t.start + 2, 10);
          puff += keys(f, [[t.start + 2, 0], [t.start + 8, 1], [t.start + 20, 1], [t.start + 26, 0]]);
          if (k >= 0 && f < t.start + 28) face = "proud";
          if (k > 0 && k < 1) tear = { k, date: t.old, land: t.land };
          if (k >= 1) pile.push([...t.land, t.old]);
        });
        if (f >= 112) face = "proud";

        let s = `<g filter="url(#dof)">${Room(sky)}</g>`;
        s += Mister({ pages, date, face, armL: armLAt(f), armR: armRAt(f), puff: Math.min(1, puff), step, tear, pile });
        s += Light({ sun, moon, night, dawn, sweep });
        s += Dust(fr, Math.max(sun, dawn * 0.7));
        scene.innerHTML = s;
      }

      draw(0);
      const proxy = { f: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(proxy, { f: FRAMES, duration: FRAMES / FPS, ease: "none", onUpdate: () => draw(proxy.f) }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
